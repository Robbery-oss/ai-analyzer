<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #131415); color: var(--tg-theme-text-color, #ffffff); font-family: -apple-system, sans-serif; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .upload-btn, .submit-btn { width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: none; font-size: 16px; box-sizing: border-box; }
        .upload-btn { background-color: #232427; color: #0a84ff; cursor: pointer; display: inline-block; border: 1px solid #333;}
        .submit-btn { background-color: #0a84ff; color: white; font-weight: bold; cursor: pointer; display: none; }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #333; }
        #loading-box { display: none; margin-top: 20px; }
        .progress-container { background-color: #232427; border-radius: 10px; width: 100%; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { background-color: #0a84ff; width: 0%; height: 100%; transition: width 0.3s ease; }
        .result-box { background-color: #1c1c1e; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #32d74b; text-align: left; }
        .error-box { background-color: #2d1a1c; padding: 15px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #ff453a; color: #ff453a; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Нейросеть V2.5</h2>
        <p style="color: #8e8e93; font-size: 14px; margin-top: 0;">Интеллектуальный анализ матчей</p>
        
        <label class="upload-btn" id="upload-label">
            📸 Загрузить скриншот линии
            <input type="file" id="image-upload" accept="image/*">
        </label>
        
        <img id="preview" src="" alt="Скриншот">
        <button class="submit-btn" id="analyze-btn">🚀 Запустить ИИ-сканирование</button>
        
        <div id="loading-box">
            <div style="color: #8e8e93; font-size: 14px;">Отправка на облачный сервер...</div>
            <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
        
        <div class="error-box" id="error-box"></div>
        <div class="result-box" id="result"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const imageUpload = document.getElementById('image-upload');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loadingBox = document.getElementById('loading-box');
        const progressBar = document.getElementById('progress-bar');
        const errorBox = document.getElementById('error-box');
        const resultBox = document.getElementById('result');
        const uploadLabel = document.getElementById('upload-label');

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    errorBox.style.display = 'none';
                    resultBox.style.display = 'none';
                    analyzeBtn.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        analyzeBtn.addEventListener('click', async function() {
            if (!imageUpload.files[0]) return;
            
            uploadLabel.style.display = 'none';
            analyzeBtn.style.display = 'none';
            loadingBox.style.display = 'block';
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            
            let progress = 0;
            let progressInterval = setInterval(() => {
                progress += 5; if (progress > 90) progress = 90;
                progressBar.style.width = progress + '%';
            }, 300);

            // Ссылка на рабочий сервер Render исправлена
            const SERVER_URL = "https://ai-bot-backend-1mvc.onrender.com/analyze"; 

            const formData = new FormData();
            formData.append('image', imageUpload.files[0]);

            try {
                const response = await fetch(SERVER_URL, { method: "POST", body: formData });
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                loadingBox.style.display = 'none';

                if (!response.ok) throw new Error("Ошибка связи с сервером");
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                resultBox.innerHTML = `
                    <h3 style="color: #32d74b; margin-top: 0; font-size: 18px; text-align: center;">✅ Анализ завершен</h3>
                    <div style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 15px; text-align: center; background: #232427; padding: 10px; border-radius: 8px;">⚽ ${data.team1} - ${data.team2}</div>
                    <div style="border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: rgba(10, 132, 255, 0.05);">
                        <div style="font-size: 12px; color: #0a84ff; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🎯 Основной прогноз</div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-size: 16px; font-weight: bold; color: #fff;">${data.best_pick}</span>
                            <span style="color: #32d74b; font-weight: bold; font-size: 18px;">${data.probability_pct}%</span>
                        </div>
                        <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 10px;">Коэффициент: <b style="color: #fff;">${data.odd}</b></div>
                        <div style="font-size: 12px; color: #a1a1aa; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">🧠 <b>Логика:</b> ${data.analysis_logic}</div>
                    </div>
                `;
                resultBox.style.display = 'block';
                tg.MainButton.text = "СДЕЛАТЬ СТАВКУ";
                tg.MainButton.show();
                tg.MainButton.onClick(() => tg.openLink("https://lkhv.pro/66ca12"));
            } catch (err) {
                clearInterval(progressInterval);
                loadingBox.style.display = 'none';
                errorBox.innerHTML = `<b>⚠️ Ошибка:</b><br>${err.message}`;
                errorBox.style.display = 'block';
                uploadLabel.style.display = 'inline-block';
                analyzeBtn.style.display = 'block';
                analyzeBtn.innerText = "🔄 Попробовать еще раз";
            }
        });
    </script>
</body>
</html>
