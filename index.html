<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #131415); color: var(--tg-theme-text-color, #ffffff); font-family: -apple-system, sans-serif; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .upload-btn, .submit-btn { width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: none; font-size: 16px; box-sizing: border-box; }
        .upload-btn { background-color: #232427; color: #0a84ff; cursor: pointer; display: block; border: 1px solid #333;}
        .submit-btn { background-color: #0a84ff; color: white; font-weight: bold; cursor: pointer; display: none; }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #333; }
        #loading-box { display: none; margin-top: 20px; }
        .progress-container { background-color: #232427; border-radius: 10px; width: 100%; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { background-color: #0a84ff; width: 0%; height: 100%; transition: width 0.3s ease; }
        .result-box { background-color: #1c1c1e; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #32d74b; text-align: left; }
        .error-box { background-color: #2d1a1c; padding: 15px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #ff453a; color: #ff453a; text-align: left; font-size: 14px; }
        .hint { color: #8e8e93; font-size: 12px; margin-top: 8px; }
        #quota-line { color: #8e8e93; font-size: 13px; margin: 4px 0 12px; min-height: 18px; }
        #upload-after-wrap { display: none; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Нейросеть V2.5</h2>
        <p style="color: #8e8e93; font-size: 14px; margin-top: 0;">Интеллектуальный анализ матчей</p>
        
        <label class="upload-btn" id="upload-label-top">
            📸 Загрузить скриншот линии
            <input type="file" id="image-upload" accept="image/*">
        </label>
        <div id="quota-line">Загрузка лимита…</div>
        
        <img id="preview" src="" alt="Скриншот">
        <button class="submit-btn" id="analyze-btn">🚀 Получить прогноз</button>
        
        <div id="loading-box">
            <div id="loading-text" style="color: #8e8e93; font-size: 14px;">Отправка на сервер анализа...</div>
            <p class="hint">Первый запрос после простоя может занять до 1–2 минут (сервер просыпается).</p>
            <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
        
        <div class="error-box" id="error-box"></div>
        <div class="result-box" id="result"></div>

        <div id="upload-after-wrap">
            <label class="upload-btn" id="upload-label-bottom">
                📸 Загрузить скриншот линии
                <input type="file" id="image-upload-bottom" accept="image/*">
            </label>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const DEFAULT_API_BASE = "https://ai-bot-backend-lmvc.onrender.com";
        const apiBase = (urlParams.get("api") || DEFAULT_API_BASE).replace(/\/$/, "");
        const ANALYZE_URL = apiBase + "/analyze";
        const QUOTA_URL = apiBase + "/quota";
        const REF_LINK = urlParams.get("ref") || "https://lkhv.pro/66ca12";
        const REQUEST_TIMEOUT_MS = 120000;

        const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
        const userId = tgUser && tgUser.id ? String(tgUser.id) : null;

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML;
        }

        function formatQuotaText(quota) {
            if (!quota) return "Лимит: откройте через бота в Telegram";
            if (quota.unlimited) return "Доступно анализов: ♾️ безлимит";
            const left = Math.max(0, (quota.limit || 0) - (quota.used || 0));
            return `Доступно анализов: <b>${left}</b> из ${quota.limit}`;
        }

        function renderQuota(quota) {
            const el = document.getElementById("quota-line");
            el.innerHTML = formatQuotaText(quota);
        }

        async function fetchWithTimeout(url, options, timeoutMs) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(id);
            }
        }

        async function refreshQuota() {
            if (!userId) {
                renderQuota(null);
                return;
            }
            try {
                const response = await fetchWithTimeout(
                    QUOTA_URL + "?user_id=" + encodeURIComponent(userId),
                    { method: "GET" },
                    30000
                );
                const raw = await response.text();
                let data = {};
                try { data = raw ? JSON.parse(raw) : {}; } catch (_) { return; }
                if (response.ok && data.quota) renderQuota(data.quota);
            } catch (_) {
                document.getElementById("quota-line").textContent = "Лимит: обновится после анализа";
            }
        }

        refreshQuota();

        const imageUpload = document.getElementById("image-upload");
        const imageUploadBottom = document.getElementById("image-upload-bottom");
        const preview = document.getElementById("preview");
        const analyzeBtn = document.getElementById("analyze-btn");
        const loadingBox = document.getElementById("loading-box");
        const loadingText = document.getElementById("loading-text");
        const progressBar = document.getElementById("progress-bar");
        const errorBox = document.getElementById("error-box");
        const resultBox = document.getElementById("result");
        const uploadLabelTop = document.getElementById("upload-label-top");
        const uploadAfterWrap = document.getElementById("upload-after-wrap");

        function onFileSelected(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                preview.src = ev.target.result;
                preview.style.display = "block";
                errorBox.style.display = "none";
                resultBox.style.display = "none";
                uploadAfterWrap.style.display = "none";
                analyzeBtn.style.display = "block";
                uploadLabelTop.style.display = "block";
            };
            reader.readAsDataURL(file);
        }

        function bindFileInput(input) {
            input.addEventListener("change", function(e) {
                const file = e.target.files[0];
                onFileSelected(file);
                if (input !== imageUpload && file) {
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    imageUpload.files = dt.files;
                }
                if (input !== imageUploadBottom && file) {
                    const dt2 = new DataTransfer();
                    dt2.items.add(file);
                    imageUploadBottom.files = dt2.files;
                }
            });
        }

        bindFileInput(imageUpload);
        bindFileInput(imageUploadBottom);

        analyzeBtn.addEventListener("click", async function() {
            if (!imageUpload.files[0]) return;

            uploadLabelTop.style.display = "none";
            uploadAfterWrap.style.display = "none";
            analyzeBtn.style.display = "none";
            loadingBox.style.display = "block";
            errorBox.style.display = "none";
            resultBox.style.display = "none";
            loadingText.textContent = "Отправка на сервер анализа...";

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 3;
                if (progress > 92) progress = 92;
                progressBar.style.width = progress + "%";
            }, 400);

            const formData = new FormData();
            formData.append("image", imageUpload.files[0]);
            if (userId) formData.append("user_id", userId);

            try {
                const response = await fetchWithTimeout(
                    ANALYZE_URL,
                    { method: "POST", body: formData },
                    REQUEST_TIMEOUT_MS
                );
                clearInterval(progressInterval);
                progressBar.style.width = "100%";
                loadingBox.style.display = "none";

                let data;
                const raw = await response.text();
                try {
                    data = raw ? JSON.parse(raw) : {};
                } catch (_) {
                    throw new Error("Сервер вернул не JSON. Проверь, что API задеплоен (GET " + apiBase + " → status ok).");
                }

                if (data.quota) renderQuota(data.quota);

                if (!response.ok) {
                    throw new Error(data.error || ("Ошибка сервера HTTP " + response.status));
                }
                if (data.error) throw new Error(data.error);

                resultBox.innerHTML = `
                    <h3 style="color: #32d74b; margin-top: 0; font-size: 18px; text-align: center;">✅ Анализ завершён</h3>
                    <div style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 15px; text-align: center; background: #232427; padding: 10px; border-radius: 8px;">⚽ ${escapeHtml(data.team1)} — ${escapeHtml(data.team2)}</div>
                    <div style="border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: rgba(10, 132, 255, 0.05);">
                        <div style="font-size: 12px; color: #0a84ff; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🎯 Прогноз</div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px;">
                            <span style="font-size: 16px; font-weight: bold; color: #fff;">${escapeHtml(data.best_pick)}</span>
                            <span style="color: #32d74b; font-weight: bold; font-size: 18px; flex-shrink: 0;">${escapeHtml(data.probability_pct)}%</span>
                        </div>
                        <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 10px;">Коэффициент: <b style="color: #fff;">${escapeHtml(data.odd)}</b></div>
                        <div style="font-size: 12px; color: #a1a1aa; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">🧠 <b>Логика:</b> ${escapeHtml(data.analysis_logic)}</div>
                    </div>
                `;
                resultBox.style.display = "block";
                preview.style.display = "block";
                uploadAfterWrap.style.display = "block";

                tg.MainButton.setText("СДЕЛАТЬ СТАВКУ");
                tg.MainButton.show();
                tg.MainButton.onClick(() => tg.openLink(REF_LINK));
            } catch (err) {
                clearInterval(progressInterval);
                loadingBox.style.display = "none";
                progressBar.style.width = "0%";

                let msg = err.message || String(err);
                if (err.name === "AbortError") {
                    msg = "Превышено время ожидания (2 мин). Сервер на бесплатном Render мог долго просыпаться — попробуй ещё раз.";
                } else if (msg === "Failed to fetch" || msg.includes("NetworkError")) {
                    msg = "Не удалось связаться с API (" + ANALYZE_URL + "). Чаще всего: сервер не задеплоен, неверный URL или Render спит. Открой в браузере " + apiBase + " — должно быть {\"status\":\"ok\"}.";
                }

                errorBox.innerHTML = "<b>⚠️ Ошибка</b><br>" + escapeHtml(msg);
                errorBox.style.display = "block";
                uploadLabelTop.style.display = "block";
                analyzeBtn.style.display = "block";
                analyzeBtn.innerText = "🔄 Попробовать ещё раз";
            }
        });
    </script>
</body>
</html>
