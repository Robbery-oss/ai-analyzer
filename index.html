<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #131415);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        select, .upload-btn, .submit-btn {
            width: 100%; padding: 16px; margin: 10px 0;
            border-radius: 12px; border: none; font-size: 16px; box-sizing: border-box;
        }
        select { background-color: #232427; color: white; outline: none; border: 1px solid #333; }
        .upload-btn { background-color: #232427; color: #0a84ff; cursor: pointer; display: inline-block; border: 1px solid #333;}
        .submit-btn { background-color: #0a84ff; color: white; font-weight: bold; cursor: pointer; display: none; }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #333; }
        
        #loading-box { display: none; margin-top: 20px; }
        .progress-container { background-color: #232427; border-radius: 10px; width: 100%; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { background-color: #0a84ff; width: 0%; height: 100%; transition: width 0.3s ease; }
        #status-text { color: #8e8e93; font-size: 14px; margin-top: 10px; }
        
        .result-box { background-color: #1c1c1e; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #32d74b; text-align: left; }
        .error-box { background-color: #2d1a1c; padding: 15px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #ff453a; color: #ff453a; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Нейросеть V2.5</h2>
        <p style="color: #8e8e93; font-size: 14px; margin-top: 0;">Интеллектуальный анализ матчей</p>
        
        <select id="sport-select">
            <option value="" disabled selected>🏆 Выберите спорт</option>
            <option value="football">⚽ Футбол</option>
            <option value="hockey">🏒 Хоккей</option>
            <option value="basketball">🏀 Баскетбол</option>
            <option value="tennis">🎾 Теннис</option>
            <option value="esports">🎮 Киберспорт</option>
        </select>

        <label class="upload-btn">
            📸 Загрузить скриншот линии
            <input type="file" id="image-upload" accept="image/*">
        </label>
        
        <img id="preview" src="" alt="Скриншот">
        <button class="submit-btn" id="analyze-btn">🚀 Запустить сканирование</button>
        
        <div id="loading-box">
            <div id="status-text">Инициализация модулей...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        
        <div class="error-box" id="error-box">
            <b>⚠️ Ошибка сканирования</b><br><br>
            На скриншоте не найдено букмекерских данных. Пожалуйста, загрузите четкое изображение линии БК, где хорошо видно коэффициенты и исходы.
        </div>

        <div class="result-box" id="result"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const sportSelect = document.getElementById('sport-select');
        const imageUpload = document.getElementById('image-upload');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        
        const loadingBox = document.getElementById('loading-box');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const errorBox = document.getElementById('error-box');
        const resultBox = document.getElementById('result');

        let imageFile = null;

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                imageFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    errorBox.style.display = 'none';
                    resultBox.style.display = 'none';
                    checkInputs();
                }
                reader.readAsDataURL(file);
            }
        });

        sportSelect.addEventListener('change', checkInputs);

        function checkInputs() {
            if (sportSelect.value && imageUpload.files.length > 0) {
                analyzeBtn.style.display = 'block';
            }
        }

        analyzeBtn.addEventListener('click', async function() {
            analyzeBtn.style.display = 'none';
            loadingBox.style.display = 'block';
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            progressBar.style.width = '0%';
            
            try {
                const result = await Tesseract.recognize(imageFile, 'rus+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            let pct = Math.floor(m.progress * 100);
                            progressBar.style.width = pct + '%';
                            
                            if (pct < 30) statusText.innerText = "Распознавание участников матча...";
                            else if (pct < 60) statusText.innerText = "Поиск букмекерских паттернов...";
                            else if (pct < 90) statusText.innerText = "Синхронизация с базой статистики...";
                            else statusText.innerText = "Генерация аналитического отчета...";
                        }
                    }
                });

                const text = result.data.text;
                const textNoSpaces = text.replace(/\s+/g, '');
                loadingBox.style.display = 'none';

                const hasBettingMarkers = /(тотал|фора|победа|ничья|коэф|исход|кэф|тб|тм|больше|меньше|матч|\d[\.,]\d{2})/i.test(text);

                if (textNoSpaces.length < 15 || !hasBettingMarkers) {
                    errorBox.style.display = 'block';
                    analyzeBtn.style.display = 'block';
                    analyzeBtn.innerText = "🔄 Попробовать еще раз";
                } else {
                    const words = text.match(/[А-ЯЁA-Z][а-яёa-z]{2,}|[А-ЯЁA-Z]{2,}/g) || [];
                    const stopWords = ['Тотал', 'Фора', 'Победа', 'Ничья', 'Матч', 'Тайм', 'Больше', 'Меньше', 'Коэффициент', 'Исход', 'Событие', 'Линия', 'Ординар', 'Экспресс', 'Команда', 'Коменда', 'Результат', 'Основное', 'Время', 'Двойной', 'Шанс', 'Угловые', 'Голы', 'Счет', 'Хозяева', 'Гости', 'Все', 'Основные', 'Таймы', 'Рекомендации', 'Данный', 'Или', 'Нет', 'Да', 'Выиграла', 'Сыграла', 'Клубы', 'Клубные', 'Товарищеские'];
                    const stopWordsUpper = stopWords.map(w => w.toUpperCase());

                    const validWords = words.filter(w => !stopWordsUpper.includes(w.toUpperCase()));

                    const wordCounts = {};
                    validWords.forEach(w => {
                        const upper = w.toUpperCase();
                        if (!wordCounts[upper]) {
                            wordCounts[upper] = { count: 0, original: w };
                        }
                        wordCounts[upper].count++;
                    });

                    const sortedWords = Object.values(wordCounts).sort((a, b) => b.count - a.count);
                    
                    let matchName = "Анализ скрытого события"; 
                    if (sortedWords.length >= 2) {
                        matchName = `${sortedWords[0].original} — ${sortedWords[1].original}`;
                    } else if (sortedWords.length === 1) {
                        matchName = `Матч с участием: ${sortedWords[0].original}`;
                    }

                    generatePrediction(sportSelect.value, matchName);
                }
            } catch (err) {
                loadingBox.style.display = 'none';
                errorBox.style.display = 'block';
                analyzeBtn.style.display = 'block';
            }
        });

        function generatePrediction(sport, matchName) {
            const intros = [
                "Данные успешно верифицированы. Найден оптимальный паттерн.",
                "Алгоритм сопоставил историю встреч. Фиксируем аномалию в линии.",
                "Глубокий анализ завершен. Выявлен исход с максимальным ROI."
            ];
            
            const outcomes = {
                'football': ["Тотал Больше (2.5)", "Обе забьют: Да", "Фора 1 (0)", "Тотал Меньше (3.5)", "Индивидуальный Тотал 1 Больше (1.5)", "Победа 1"],
                'hockey': ["Тотал Больше (4.5)", "Победа в матче 1", "Фора 2 (+1.5)", "Тотал Меньше (6.5)", "Обе забьют: Да"],
                'basketball': ["Фора 1 (-5.5)", "Тотал Больше", "Индивидуальный тотал 2 Меньше", "Победа 1 с учетом ОТ"],
                'tennis': ["Победа 1", "Тотал геймов Больше (21.5)", "Фора 2 (+3.5)", "Точный счет 2:0"],
                'esports': ["Победа 1 на первой карте", "Тотал карт Больше (2.5)", "Фора 2 (+1.5)"]
            };

            const deepExplanations = [
                "Аналитический модуль сопоставил показатели ожидаемых голов (xG/xPts), индекс усталости ключевых игроков и историю очных встреч. Выявлена критическая уязвимость в линии защиты, что в 82% подобных сценариев приводит к уверенному проходу данного исхода.",
                "Нейросеть зафиксировала сильный дисбаланс в распределении денежных потоков (прогруз). Вкупе с математической моделью текущей формы команд, алгоритм определяет этот исход как максимально валуйный с минимальной маржой риска для игрока.",
                "Алгоритм проанализировал микротравмы основного состава и тактический рисунок тренеров в последних матчах. Исторические статистические паттерны показывают, что при подобной расстановке сил данный исход пробивается с вероятностью, сильно превышающей расчеты букмекера."
            ];

            const selectedIntro = intros[Math.floor(Math.random() * intros.length)];
            const availableOutcomes = outcomes[sport] || outcomes['football'];
            
            const shuffled = availableOutcomes.sort(() => 0.5 - Math.random());
            const outcome1 = shuffled[0];
            const outcome2 = shuffled[1];
            
            const prob1 = Math.floor(Math.random() * (94 - 82 + 1)) + 82; 
            const prob2 = Math.floor(Math.random() * (75 - 60 + 1)) + 60; 

            const mainExp = deepExplanations[Math.floor(Math.random() * deepExplanations.length)];

            const resultHTML = `
                <h3 class="result-title" style="color: #32d74b; margin-top: 0; font-size: 18px; text-align: center;">✅ Анализ завершен</h3>
                <div style="color: #8e8e93; font-size: 13px; text-align: center; margin-bottom: 15px;">${selectedIntro}</div>
                
                <div style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 15px; text-align: center; background: #232427; padding: 10px; border-radius: 8px; border: 1px dashed #333;">
                    🔍 Распознано: <span style="color: #0a84ff;">${matchName}</span>
                </div>

                <div style="border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: rgba(10, 132, 255, 0.05);">
                    <div style="font-size: 12px; color: #0a84ff; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🎯 Основной прогноз</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="font-size: 16px; font-weight: bold; color: #fff;">${outcome1}</span>
                        <span style="color: #32d74b; font-weight: bold; font-size: 18px;">${prob1}%</span>
                    </div>
                    <div style="font-size: 12px; color: #a1a1aa; line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                        🧠 <b>Логика ИИ:</b> ${mainExp}
                    </div>
                </div>

                <div style="border: 1px solid #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; background: rgba(255, 69, 58, 0.05);">
                    <div style="font-size: 12px; color: #ff453a; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🔥 Альтернативный риск-исход</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 15px; font-weight: bold; color: #fff;">${outcome2}</span>
                        <span style="color: #ffd60a; font-weight: bold; font-size: 16px;">${prob2}%</span>
                    </div>
                </div>

                <div style="margin-top: 10px; font-size: 13px; color: #ffd60a; font-weight: bold; text-align: center; background: rgba(255, 214, 10, 0.1); padding: 12px; border-radius: 8px; border: 1px dashed #ffd60a;">
                    🎁 При регистрации используйте промокод: <span style="font-size: 18px; color: #fff; margin-left: 5px;">SOTNI</span>
                </div>
            `;

            const resultBox = document.getElementById('result');
            resultBox.innerHTML = resultHTML;
            resultBox.style.display = 'block';

            tg.MainButton.text = "СДЕЛАТЬ СТАВКУ (ПРОМО: SOTNI)";
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                tg.openLink("https://lkhv.pro/66ca12");
            });
        }
    </script>
</body>
</html>
