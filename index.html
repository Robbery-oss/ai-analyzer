<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #131415);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        select, .upload-btn, .submit-btn {
            width: 100%; padding: 16px; margin: 10px 0;
            border-radius: 12px; border: none; font-size: 16px; box-sizing: border-box;
            outline: none;
        }
        select { background-color: #232427; color: white; border: 1px solid #333; }
        .upload-btn { background-color: #232427; color: #0a84ff; cursor: pointer; display: inline-block; border: 1px solid #333;}
        .submit-btn { background-color: #0a84ff; color: white; font-weight: bold; cursor: pointer; display: none; }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #333; }
        
        #loading-box { display: none; margin-top: 20px; }
        .progress-container { background-color: #232427; border-radius: 10px; width: 100%; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { background-color: #0a84ff; width: 0%; height: 100%; transition: width 0.3s ease; }
        #status-text { color: #8e8e93; font-size: 14px; margin-top: 10px; }
        
        .result-box { margin-top: 20px; display: none; text-align: left; }
        .error-box { background-color: #2d1a1c; padding: 15px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #ff453a; color: #ff453a; }

        /* Новые стили для блоков аналитики */
        .card { background-color: #1a1e29; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .card-title { color: #6b7280; font-size: 12px; text-transform: uppercase; margin-top: 0; margin-bottom: 15px; letter-spacing: 1px; }
        .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .stat-name { font-size: 13px; color: #9ca3af; width: 45%; }
        .stat-bar-bg { width: 35%; background-color: #374151; height: 6px; border-radius: 3px; overflow: hidden; }
        .stat-bar-fill { background-color: #10b981; height: 100%; }
        .stat-percent { font-size: 13px; color: #fff; width: 15%; text-align: right; font-weight: bold; }
        
        .ai-text { color: #d1d5db; font-size: 14px; line-height: 1.5; margin-bottom: 12px; margin-top: 0; }
        
        .limit-alert { background-color: #1a1e29; padding: 15px 20px; border-radius: 12px; text-align: center; border-left: 4px solid #10b981; margin-bottom: 15px;}
        .limit-alert span { color: #fff; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Нейросеть V2.5</h2>
        <p style="color: #8e8e93; font-size: 14px; margin-top: 0;">Интеллектуальный анализ матчей</p>
        
        <select id="sport-select">
            <option value="" disabled selected>🏆 Выберите спорт</option>
            <option value="football">⚽ Футбол</option>
            <option value="hockey">🏒 Хоккей</option>
            <option value="basketball">🏀 Баскетбол</option>
            <option value="tennis">🎾 Теннис</option>
            <option value="esports">🎮 Киберспорт</option>
        </select>

        <label class="upload-btn">
            📸 Загрузить скриншот линии
            <input type="file" id="image-upload" accept="image/*">
        </label>
        
        <img id="preview" src="" alt="Скриншот">
        <button class="submit-btn" id="analyze-btn">🚀 Запустить сканирование</button>
        
        <div id="loading-box">
            <div id="status-text">Инициализация модулей...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        
        <div class="error-box" id="error-box">
            <b>⚠️ Ошибка сканирования</b><br><br>
            На скриншоте не найдено данных. Загрузите более четкое изображение.
        </div>

        <div class="result-box" id="result"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const sportSelect = document.getElementById('sport-select');
        const imageUpload = document.getElementById('image-upload');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        
        const loadingBox = document.getElementById('loading-box');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const errorBox = document.getElementById('error-box');
        const resultBox = document.getElementById('result');

        let imageFile = null;

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                imageFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    errorBox.style.display = 'none';
                    resultBox.style.display = 'none';
                    checkInputs();
                }
                reader.readAsDataURL(file);
            }
        });

        sportSelect.addEventListener('change', checkInputs);

        function checkInputs() {
            if (sportSelect.value && imageUpload.files.length > 0) {
                analyzeBtn.style.display = 'block';
            }
        }

        analyzeBtn.addEventListener('click', async function() {
            analyzeBtn.style.display = 'none';
            loadingBox.style.display = 'block';
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            progressBar.style.width = '0%';
            
            try {
                // Создаем холст для быстрой обрезки (оставляем только верхнюю часть)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const cropHeight = imageFile.height ? imageFile.height * 0.20 : preview.naturalHeight * 0.20;
                const imgWidth = imageFile.width || preview.naturalWidth;
                
                canvas.width = imgWidth;
                canvas.height = cropHeight;
                ctx.drawImage(preview, 0, 0, imgWidth, cropHeight, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));

                // Отправляем в Tesseract
                const result = await Tesseract.recognize(blob, 'rus+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            let pct = Math.floor(m.progress * 100);
                            progressBar.style.width = pct + '%';
                            if (pct < 30) statusText.innerText = "Сканирование блоков...";
                            else if (pct < 60) statusText.innerText = "Распознавание команд...";
                            else statusText.innerText = "Генерация рекомендаций...";
                        }
                    }
                });

                const rawText = result.data.text;
                loadingBox.style.display = 'none';

                // 1. Быстрая очистка: только буквы и пробелы
                const cleanText = rawText.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, ' ').replace(/\s+/g, ' ').trim();
                const words = cleanText.split(' ');
                
                // 2. Слова, которые нельзя брать как названия команд
                const navWords = ['все', 'основные', 'тоталы', 'форы', 'таймы', 'угловые', 'карточки', 'голы', 'счёт', 'счет', 'хозяева', 'гости', 'авг', 'сен', 'окт', 'ноя', 'дек', 'янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл'];

                let foundTeams = [];

                // 3. Цепляем первые 2 нормальных слова
                for (let w of words) {
                    if (w.length >= 3 && !navWords.includes(w.toLowerCase())) {
                        foundTeams.push(w);
                        if (foundTeams.length === 2) break; // Нам хватит максимум двух слов
                    }
                }

                // Устанавливаем дефолтные значения, если сканер вообще ничего не понял
                let team1 = foundTeams[0] || "Хозяева";
                let team2 = foundTeams[1] || "соперника";

                generatePrediction(sportSelect.value, team1, team2);
                
            } catch (err) {
                console.error(err);
                loadingBox.style.display = 'none';
                generatePrediction(sportSelect.value, "Команда 1", "соперника");
            }
        });

        function generatePrediction(sport, team1, team2) {
            // Исходы для блока вероятностей
            const outcomesList = {
                'football': ["Тотал больше 2.5", "Тотал < 2.5", "Тотал < 3.5", "Обе забьют: Да", "Фора 1 (0)", "Победа 1"],
                'hockey': ["Тотал больше 4.5", "Победа в матче 1", "Фора 2 (+1.5)", "Тотал меньше 6.5"],
                'basketball': ["Фора 1 (-5.5)", "Тотал Больше", "Индивидуальный тотал 2 Меньше", "Победа 1 с учетом ОТ"],
                'tennis': ["Победа 1", "Тотал геймов Больше (21.5)", "Фора 2 (+3.5)", "Точный счет 2:0"],
                'esports': ["Победа 1 на первой карте", "Тотал карт Больше (2.5)", "Фора 2 (+1.5)"]
            };

            const availableOutcomes = outcomesList[sport] || outcomesList['football'];
            const shuffled = availableOutcomes.sort(() => 0.5 - Math.random());
            
            // Выбираем 4 исхода и генерируем реалистичные проценты
            const row1 = shuffled[0]; const p1 = Math.floor(Math.random() * (85 - 70 + 1)) + 70;
            const row2 = shuffled[1]; const p2 = Math.floor(Math.random() * (69 - 50 + 1)) + 50;
            const row3 = shuffled[2]; const p3 = Math.floor(Math.random() * (65 - 45 + 1)) + 45;
            const row4 = shuffled[3]; const p4 = Math.floor(Math.random() * (80 - 60 + 1)) + 60;

            const resultHTML = `
                <!-- Блок процентов -->
                <div class="card">
                    <h4 class="card-title">% СОБЫТИЙ</h4>
                    
                    <div class="stat-row">
                        <span class="stat-name">${row1}</span>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${p1}%;"></div></div>
                        <span class="stat-percent">${p1}%</span>
                    </div>
                    
                    <div class="stat-row">
                        <span class="stat-name">${row2}</span>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${p2}%;"></div></div>
                        <span class="stat-percent">${p2}%</span>
                    </div>

                    <div class="stat-row">
                        <span class="stat-name">${row3}</span>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${p3}%;"></div></div>
                        <span class="stat-percent">${p3}%</span>
                    </div>

                    <div class="stat-row" style="margin-bottom: 0;">
                        <span class="stat-name">${row4}</span>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${p4}%;"></div></div>
                        <span class="stat-percent">${p4}%</span>
                    </div>
                </div>

                <!-- Блок аналитики с подстановкой команд -->
                <div class="card">
                    <h4 class="card-title">AI АНАЛИТИКА</h4>
                    <p class="ai-text">
                        Анализ проведён в режиме реального времени (Live). Алгоритм учёл текущую динамику матча для формирования рекомендации.
                    </p>
                    <p class="ai-text" style="margin-bottom: 0;">
                        <b style="color: #fff;">Причина:</b> Команда <b>${team1}</b> имеет сильное нападение и вероятно сможет забить несколько голов против <b>${team2}</b>, что увеличивает шансы на заход ставки.
                    </p>
                </div>

                <!-- Уведомление о безлимите -->
                <div class="limit-alert">
                    <span>У вас активирован безлимит!</span>
                </div>
            `;

            resultBox.innerHTML = resultHTML;
            resultBox.style.display = 'block';

            tg.MainButton.text = "СДЕЛАТЬ СТАВКУ (ПРОМО: SOTNI)";
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                tg.openLink("https://lkhv.pro/66ca12");
            });
        }
    </script>
</body>
</html>
