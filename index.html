<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics</title>
    <!-- Подключаем библиотеку Telegram для Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовый дизайн: темная тема, скругленные углы */
        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        select, .upload-btn, .submit-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        select {
            background-color: #2c2c2e;
            color: white;
            outline: none;
        }
        .upload-btn {
            background-color: #3a3a3c;
            color: #0a84ff;
            cursor: pointer;
            display: inline-block;
        }
        .submit-btn {
            background-color: #0a84ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: none; /* Прячем кнопку до загрузки фото */
        }
        input[type="file"] {
            display: none;
        }
        #preview {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            border: 2px solid #3a3a3c;
        }
        .result-box {
            background-color: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            border: 1px solid #0a84ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Анализ матча</h2>
        <p style="color: #8e8e93; font-size: 14px;">Выберите спорт и загрузите скриншот</p>
        
        <!-- Выбор спорта -->
        <select id="sport-select">
            <option value="" disabled selected>🏆 Выберите дисциплину</option>
            <option value="football">⚽ Футбол</option>
            <option value="hockey">🏒 Хоккей</option>
            <option value="basketball">🏀 Баскетбол</option>
            <option value="tennis">🎾 Теннис</option>
            <option value="esports">🎮 Киберспорт</option>
        </select>

        <!-- Загрузка скриншота -->
        <label class="upload-btn">
            📸 Загрузить скриншот
            <input type="file" id="image-upload" accept="image/*">
        </label>
        
        <!-- Место для показа загруженной картинки -->
        <img id="preview" src="" alt="Ваш скриншот">

        <!-- Кнопка анализа -->
        <button class="submit-btn" id="analyze-btn">Запустить AI-анализ</button>
        
        <!-- Блок с результатом (появится позже) -->
        <div class="result-box" id="result"></div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение на весь экран телефона

        const sportSelect = document.getElementById('sport-select');
        const imageUpload = document.getElementById('image-upload');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        const resultBox = document.getElementById('result');

        // Логика: когда пользователь выбрал картинку
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    checkInputs(); // Проверяем, можно ли показать кнопку
                }
                reader.readAsDataURL(file);
            }
        });

        // Логика: когда пользователь выбрал спорт
        sportSelect.addEventListener('change', checkInputs);

        // Функция проверки: если выбран спорт и загружено фото -> показываем кнопку
        function checkInputs() {
            if (sportSelect.value && imageUpload.files.length > 0) {
                analyzeBtn.style.display = 'block';
            }
        }

        // Логика: что происходит при нажатии на "Запустить анализ"
        analyzeBtn.addEventListener('click', function() {
            analyzeBtn.innerText = 'Анализирую данные... ⏳';
            analyzeBtn.disabled = true;
            analyzeBtn.style.opacity = '0.7';
            
            // Имитация работы нейросети (задержка 3 секунды)
            setTimeout(() => {
                analyzeBtn.style.display = 'none';
                resultBox.style.display = 'block';
                
                // Текст успешного сигнала
                resultBox.innerHTML = `
                    <h3 style="color: #32d74b; margin-top: 0;">✅ Сигнал найден!</h3>
                    <p><b>Вероятность:</b> 89%</p>
                    <p><b>Исход:</b> Тотал Больше (2.5)</p>
                `;
                
                // Показываем главную кнопку закрытия от самого Telegram
                tg.MainButton.text = "Закрыть анализатор";
                tg.MainButton.show();
                tg.MainButton.onClick(() => tg.close());
            }, 3000);
        });
    </script>
</body>
</html>
