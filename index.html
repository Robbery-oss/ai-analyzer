<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #131415);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        .info-box { background-color: #1c1c1e; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; text-align: center; }
        .result-box { display: none; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Нейросеть V2.5</h2>
        <p style="color: #8e8e93; font-size: 14px; margin-top: 0;">Интеллектуальный анализ матчей</p>
        
        <div id="default-view" class="info-box">
            <div style="font-size: 40px; margin-bottom: 10px;">📸</div>
            <b>Ожидание данных...</b><br><br>
            <span style="color: #8e8e93; font-size: 14px;">Закройте это окно и отправьте скриншот линии прямо в чат с ботом, чтобы получить прогноз.</span>
        </div>

        <div id="result-view" class="result-box">
            <!-- Сюда подставятся данные от Python -->
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const team1 = urlParams.get('team1');
        const team2 = urlParams.get('team2');
        const pick = urlParams.get('pick');
        const odd = urlParams.get('odd');
        const prob = urlParams.get('prob');
        const logic = urlParams.get('logic');

        if (team1 && pick) {
            document.getElementById('default-view').style.display = 'none';
            
            const resultHTML = `
                <h3 style="color: #32d74b; margin-top: 0; font-size: 18px; text-align: center;">✅ Анализ завершен</h3>
                
                <div style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 15px; text-align: center; background: #232427; padding: 10px; border-radius: 8px; border: 1px dashed #333;">
                    ⚽ ${team1} - ${team2}
                </div>

                <div style="border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: rgba(10, 132, 255, 0.05);">
                    <div style="font-size: 12px; color: #0a84ff; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🎯 Основной прогноз</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="font-size: 16px; font-weight: bold; color: #fff;">${pick}</span>
                        <span style="color: #32d74b; font-weight: bold; font-size: 18px;">${prob}%</span>
                    </div>
                    <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 10px;">
                        Коэффициент: <b style="color: #fff;">${odd}</b>
                    </div>
                    <div style="font-size: 12px; color: #a1a1aa; line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                        🧠 <b>Логика ИИ:</b> ${logic}
                    </div>
                </div>

                <div style="margin-top: 10px; font-size: 13px; color: #ffd60a; font-weight: bold; text-align: center; background: rgba(255, 214, 10, 0.1); padding: 12px; border-radius: 8px; border: 1px dashed #ffd60a;">
                    🎁 Используйте промокод: <span style="font-size: 18px; color: #fff; margin-left: 5px;">SOTNI</span>
                </div>
            `;
            
            const resultView = document.getElementById('result-view');
            resultView.innerHTML = resultHTML;
            resultView.style.display = 'block';

            tg.MainButton.text = "СДЕЛАТЬ СТАВКУ";
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                tg.openLink("https://lkhv.pro/66ca12");
            });
        }
    </script>
</body>
</html>
