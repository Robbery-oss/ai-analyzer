<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics PRO</title>
    <!-- Библиотека Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека для считывания текста с картинок (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #131415);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        select, .upload-btn, .submit-btn {
            width: 100%; padding: 16px; margin: 10px 0;
            border-radius: 12px; border: none; font-size: 16px; box-sizing: border-box;
        }
        select { background-color: #232427; color: white; outline: none; border: 1px solid #333; }
        .upload-btn { background-color: #232427; color: #0a84ff; cursor: pointer; display: inline-block; border: 1px solid #333;}
        .submit-btn { background-color: #0a84ff; color: white; font-weight: bold; cursor: pointer; display: none; }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #333; }
        
        /* Стили для прогресс-бара и загрузки */
        #loading-box { display: none; margin-top: 20px; }
        .progress-container { background-color: #232427; border-radius: 10px; width: 100%; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { background-color: #0a84ff; width: 0%; height: 100%; transition: width 0.3s ease; }
        #status-text { color: #8e8e93; font-size: 14px; margin-top: 10px; }
        
        /* Стили для результатов и ошибок */
        .result-box { background-color: #1c1c1e; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #32d74b; text-align: left; }
        .error-box { background-color: #2d1a1c; padding: 15px; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid #ff453a; color: #ff453a; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Нейросеть V2.1</h2>
        <p style="color: #8e8e93; font-size: 14px; margin-top: 0;">Интеллектуальный анализ матчей</p>
        
        <select id="sport-select">
            <option value="" disabled selected>🏆 Выберите спорт</option>
            <option value="football">⚽ Футбол</option>
            <option value="hockey">🏒 Хоккей</option>
            <option value="basketball">🏀 Баскетбол</option>
            <option value="tennis">🎾 Теннис</option>
            <option value="esports">🎮 Киберспорт</option>
        </select>

        <label class="upload-btn">
            📸 Загрузить скриншот линии
            <input type="file" id="image-upload" accept="image/*">
        </label>
        
        <img id="preview" src="" alt="Скриншот">
        <button class="submit-btn" id="analyze-btn">🚀 Запустить сканирование</button>
        
        <!-- Блок загрузки (Иллюзия работы) -->
        <div id="loading-box">
            <div id="status-text">Инициализация модулей...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        
        <!-- Блок ошибки -->
        <div class="error-box" id="error-box">
            <b>⚠️ Ошибка сканирования</b><br><br>
            На скриншоте не найдено достаточно данных для анализа. Пожалуйста, загрузите четкое изображение, где хорошо видно команды и коэффициенты.
        </div>

        <!-- Блок результата (теперь заполняется из JS) -->
        <div class="result-box" id="result"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const sportSelect = document.getElementById('sport-select');
        const imageUpload = document.getElementById('image-upload');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        
        const loadingBox = document.getElementById('loading-box');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const errorBox = document.getElementById('error-box');
        const resultBox = document.getElementById('result');

        let imageFile = null;

        // Показ картинки и кнопки
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                imageFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    errorBox.style.display = 'none';
                    resultBox.style.display = 'none';
                    checkInputs();
                }
                reader.readAsDataURL(file);
            }
        });

        sportSelect.addEventListener('change', checkInputs);

        function checkInputs() {
            if (sportSelect.value && imageUpload.files.length > 0) {
                analyzeBtn.style.display = 'block';
            }
        }

        // Запуск анализа
        analyzeBtn.addEventListener('click', async function() {
            analyzeBtn.style.display = 'none';
            loadingBox.style.display = 'block';
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            progressBar.style.width = '0%';
            
            try {
                // Запускаем реальный сканер текста (OCR)
                const result = await Tesseract.recognize(imageFile, 'rus+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            let pct = Math.floor(m.progress * 100);
                            progressBar.style.width = pct + '%';
                            
                            // Динамическая смена текста статуса
                            if (pct < 30) statusText.innerText = "Сканирование структуры изображения...";
                            else if (pct < 60) statusText.innerText = "Извлечение текстовых данных...";
                            else if (pct < 90) statusText.innerText = "Подключение к базе статистики...";
                            else statusText.innerText = "Формирование нейронного прогноза...";
                        }
                    }
                });

                // Убираем пробелы и проверяем длину найденного текста
                const extractedText = result.data.text.replace(/\s+/g, '');
                loadingBox.style.display = 'none';

                // Защита от дурака: если букв меньше 10, выдаем ошибку
                if (extractedText.length < 10) {
                    errorBox.style.display = 'block';
                    analyzeBtn.style.display = 'block';
                    analyzeBtn.innerText = "🔄 Попробовать еще раз";
                } else {
                    // Если текст есть, генерируем прогноз
                    generatePrediction(sportSelect.value);
                }
            } catch (err) {
                // Если OCR сломался, всё равно имитируем ошибку качества картинки
                loadingBox.style.display = 'none';
                errorBox.style.display = 'block';
                analyzeBtn.style.display = 'block';
            }
        });

        // Конструктор уникальных прогнозов (Двойной исход)
        function generatePrediction(sport) {
            // 1. Случайное вступление
            const intros = [
                "Данные успешно синхронизированы. Найден оптимальный паттерн.",
                "Алгоритм сопоставил историю встреч. Фиксируем аномалию в линии.",
                "Глубокий анализ завершен. Выявлен валуйный исход."
            ];
            
            // 2. База исходов
            const outcomes = {
                'football': ["Тотал Больше (2.5)", "Обе забьют: Да", "Фора 1 (0)", "Тотал Меньше (3.5)", "Индивидуальный Тотал 1 Больше (1.5)", "Победа 1"],
                'hockey': ["Тотал Больше (4.5)", "Победа в матче 1", "Фора 2 (+1.5)", "Тотал Меньше (6.5)", "Обе забьют: Да"],
                'basketball': ["Фора 1 (-5.5)", "Тотал Больше", "Индивидуальный тотал 2 Меньше", "Победа 1 с учетом ОТ"],
                'tennis': ["Победа 1", "Тотал геймов Больше (21.5)", "Фора 2 (+3.5)", "Точный счет 2:0"],
                'esports': ["Победа 1 на первой карте", "Тотал карт Больше (2.5)", "Фора 2 (+1.5)"]
            };

            const selectedIntro = intros[Math.floor(Math.random() * intros.length)];
            const availableOutcomes = outcomes[sport] || outcomes['football'];
            
            // Перемешиваем исходы, чтобы взять два разных
            const shuffled = availableOutcomes.sort(() => 0.5 - Math.random());
            const outcome1 = shuffled[0];
            const outcome2 = shuffled[1];
            
            // Генерируем вероятности
            const prob1 = Math.floor(Math.random() * (94 - 82 + 1)) + 82; // Надежный: 82-94%
            const prob2 = Math.floor(Math.random() * (75 - 60 + 1)) + 60; // Рискованный: 60-75%

            // Собираем новую красивую верстку с двумя карточками
            const resultHTML = `
                <h3 class="result-title" style="color: #32d74b; margin-top: 0; font-size: 18px; text-align: center;">✅ Анализ завершен</h3>
                <div style="color: #8e8e93; font-size: 13px; text-align: center; margin-bottom: 15px;">${selectedIntro}</div>
                
                <div style="border: 1px solid #333; padding: 12px; border-radius: 8px; margin-bottom: 10px; background: rgba(10, 132, 255, 0.05);">
                    <div style="font-size: 12px; color: #0a84ff; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🎯 Основной прогноз</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 15px; font-weight: bold; color: #fff;">${outcome1}</span>
                        <span style="color: #32d74b; font-weight: bold; font-size: 16px;">${prob1}%</span>
                    </div>
                </div>

                <div style="border: 1px solid #333; padding: 12px; border-radius: 8px; background: rgba(255, 69, 58, 0.05);">
                    <div style="font-size: 12px; color: #ff453a; text-transform: uppercase; font-weight: bold; margin-bottom: 8px;">🔥 Рискованный исход</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 15px; font-weight: bold; color: #fff;">${outcome2}</span>
                        <span style="color: #ffd60a; font-weight: bold; font-size: 16px;">${prob2}%</span>
                    </div>
                </div>
            `;

            // Вставляем результат на страницу
            const resultBox = document.getElementById('result');
            resultBox.innerHTML = resultHTML;
            resultBox.style.display = 'block';

            tg.MainButton.text = "ЗАКРЫТЬ И СДЕЛАТЬ СТАВКУ";
            tg.MainButton.show();
            tg.MainButton.onClick(() => tg.close());
        }
    </script>
</body>
</html>
